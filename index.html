<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORGE">
  <meta name="description" content="Build your strongest self. Track workouts, nutrition, and progress.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
  <title>FORGE — Build your strongest self</title>
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header" class="header">
      <div class="header-content">
        <div class="logo" id="logo-btn" title="FORGE">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 100 100" width="28" height="28"><path fill="currentColor" d="M22 8 L72 8 L82 22 L40 22 L40 38 L68 38 L76 50 L40 50 L40 82 L22 92 Z"/></svg>
          </span>
          <span class="logo-text">FORGE</span>
        </div>
        <div class="header-actions" id="header-actions"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main" class="main">
      <!-- Screens will be rendered here -->
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-btn active" data-screen="home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-screen="workouts" aria-label="Workouts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5h11v11h-11z"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Workouts</span>
      </button>
      <button class="nav-btn" data-screen="nutrition" aria-label="Nutrition">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        <span>Nutrition</span>
      </button>
      <button class="nav-btn" data-screen="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-btn" data-screen="profile" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </nav>

    <!-- Workout Player Overlay -->
    <div id="workout-player" class="workout-player hidden"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal" class="modal"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Spark AI assistant -->
    <button type="button" id="spark-fab" class="spark-fab" aria-label="Ask Spark">
      <svg class="spark-icon" viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
        <defs>
          <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f97316"/>
            <stop offset="55%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#fbbf24"/>
          </linearGradient>
        </defs>
        <path fill="url(#sparkGrad)" d="M32 4C28 18 12 24 12 40c0 12 9 20 20 20s20-8 20-20C52 24 36 18 32 4z"/>
        <ellipse fill="#fdba74" cx="32" cy="38" rx="12" ry="14" opacity="0.9"/>
        <circle fill="#1c1917" cx="26" cy="36" r="2.8"/>
        <circle fill="#1c1917" cx="38" cy="36" r="2.8"/>
        <path fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" d="M27 43c2 2.2 8 2.2 10 0"/>
      </svg>
    </button>
    <div id="spark-panel" class="spark-panel hidden" aria-hidden="true">
      <div class="spark-panel-header">
        <div class="spark-panel-title">
          <span class="spark-mini">🔥</span>
          <div>
            <strong>Spark</strong>
            <div class="text-muted" style="font-size:11px;font-weight:400;">Your training buddy</div>
          </div>
        </div>
        <button type="button" id="spark-close" class="modal-close" aria-label="Close">×</button>
      </div>
      <div id="spark-messages" class="spark-messages"></div>
      <div class="spark-quick" id="spark-quick"></div>
      <div class="spark-input-row">
        <input id="spark-input" class="input" type="text" placeholder="Ask Spark…" autocomplete="off">
        <button type="button" id="spark-send" class="btn btn-primary btn-sm">Send</button>
      </div>
    </div>
  </div>

  <script src="data.js?v=11"></script>
  <script src="db.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
